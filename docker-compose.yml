# ============================================
# Docker Compose for Laravel CI/CD Project
# ============================================

services:
  # Laravel Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cicd-laravel-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - ./storage:/var/www/html/storage
    networks:
      - cicd-network
    depends_on:
      - db
      - redis

  # Nginx Web Server
  nginx:
    image: nginx:alpine
    container_name: cicd-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - cicd-network
    depends_on:
      - app

  # MySQL Database
  db:
    image: mysql:8.0
    container_name: cicd-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: cicd_database
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_USER: cicd_user
      MYSQL_PASSWORD: secret
    ports:
      - "3306:3306"
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - cicd-network

  # Redis Cache
  redis:
    image: redis:alpine
    container_name: cicd-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - cicd-network

networks:
  cicd-network:
    driver: bridge

volumes:
  db-data:
